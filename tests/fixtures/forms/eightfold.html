<!DOCTYPE html>
<html>
<head><title>Eightfold Form</title></head>
<body>
  <form id="application-form">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required value="Alex Example" />

    <label for="clearance">Do you hold an active Top Secret clearance?</label>
    <input type="text" id="clearance" name="security_clearance" required value="" />

    <button type="submit" id="site-submit">Submit Application</button>
  </form>
</body>
</html>
